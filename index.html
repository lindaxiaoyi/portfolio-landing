<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; color: #2B2B33; }
  * { box-sizing: border-box; }
  a { color: #6B5FA8; text-decoration: none; }
  a:hover { color: #4A3F86; }
  @keyframes omSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes discPop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes hintBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  .hint-arrow { animation: hintBob 2s ease-in-out infinite; }
  .hint-arrow-up { animation-delay: -1s; }
  @media (prefers-reduced-motion: reduce) { .hint-arrow { animation: none; } }
  ::selection { background: #D9D3F0; color: #2B2B33; }
  /* The viewBox is cropped to the artwork's own bounds, so the page is only
     ever as tall as the illustration — no viewport filling, no letterboxing. */
  .stage { height: auto; }
  /* support.js injects html,body{height:100%} and #dc-root>.sc-host{height:100%}
     into <head> at boot, which floors the document at viewport height. It lands
     after this block, so opting out needs !important. */
  html, body, #dc-root, #dc-root > .sc-host { height: auto !important; }
  /* The hints live in the SVG, so their size is scaled by canvasWidth/1600 —
     about 3px on a phone. Scale each hint group back up as the canvas narrows
     to hold the rendered text near 12px. Scaling the group rather than the
     font-size keeps the arrow in proportion with its label.
     The crate hint scales about its centre so it stays centred on the albums;
     the play hint scales about its right edge so its arrow stays on the
     tonearm and the text grows left into the empty space under the shelf.
     Staying centred caps how large the crate label can get: centre 1105 against
     a player edge at 1208 leaves 103 units either side, and the group's
     half-width is 41.85 per unit of scale, so the steps stop at 2.45 rather
     than fully compensating on the narrowest phones. */
  .hint-crate, .hint-play { transform-box: fill-box; }
  .hint-crate { transform-origin: center; }
  /* 97.83% is where the arrowhead's tip sits in the group's own box, so scaling
     about it pins the tip on the needle at every size instead of letting it
     drift left as the label grows. */
  .hint-play  { transform-origin: 97.83% center; }
  @media (max-width: 1280px) { .hint-crate, .hint-play { transform: scale(1.15); } }
  @media (max-width: 1024px) { .hint-crate, .hint-play { transform: scale(1.45); } }
  @media (max-width: 820px)  { .hint-crate, .hint-play { transform: scale(1.85); } }
  @media (max-width: 640px)  { .hint-crate, .hint-play { transform: scale(2.2); } }
  @media (max-width: 480px)  { .hint-crate, .hint-play { transform: scale(2.45); } }
</style>
</helmet>

    if (this.suppressClick) { this.suppressClick = false; return; }
    if (this.state.engaged) this.disengage();
    else this.engage();
  };

  onArmKey = (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (this.state.engaged) this.disengage(); else this.engage(); }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); this.setArm(Math.min(25, this.angle + 5)); if (this.angle >= 25) this.engage(); }
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); if (this.state.engaged) this.disengage(); else this.setArm(Math.max(0, this.angle - 5)); }
  };

  onSleeve = (e) => {
    const i = Number(e.currentTarget.getAttribute("data-i"));
    this.setState((s) => ({ active: s.active === i ? null : i }));
  };
  bindCrateFocus() {
    const attach = () => {
      const el = this.crateRef.current;
      if (!el || el.__omFocusBound) return !!el;
      el.__omFocusBound = true;
      el.addEventListener("focusin", (e) => {
        const g = e.target.closest && e.target.closest("g[data-i]");
        if (g) this.setState({ hoverIndex: Number(g.getAttribute("data-i")) });
      });
      el.addEventListener("focusout", () => {
        requestAnimationFrame(() => {
          const a = document.activeElement;
          if (!a || !a.closest || !a.closest("g[data-i]")) this.setState({ hoverIndex: null });
        });
      });
      return true;
    };
    if (!attach()) setTimeout(attach, 300);
  }

  onSleeveKey = (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      const i = Number(e.currentTarget.getAttribute("data-i"));
      this.setState((s) => ({ hoverIndex: s.hoverIndex === i ? null : i }));
    }
    if (e.key === "Escape") this.setState({ hoverIndex: null });
  };
  closeCard = () => this.setState({ active: null });

  // Touch devices never fire mouseenter, so a tap has to drive the crate too.
  // On real hover devices a click just re-asserts the sleeve already showing.
  onDiscTap = (e) => {
    const i = Number(e.currentTarget.getAttribute("data-i"));
    const canHover = window.matchMedia("(hover: hover)").matches;
    this.setState((s) => ({ hoverIndex: !canHover && s.hoverIndex === i ? null : i }));
  };

  onDiscEnter = (e) => this.setState({ hoverIndex: Number(e.currentTarget.getAttribute("data-i")) });
  onDiscLeave = (e) => {
    const i = Number(e.currentTarget.getAttribute("data-i"));
    this.setState((s) => (s.hoverIndex === i ? { hoverIndex: null } : null));
  };

  startAudio() {
    const a = this.audioRef.current;
    if (!a) return;
    a.volume = 0;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
    clearInterval(this.fade);
    this.fade = setInterval(() => {
      if (!this.audioRef.current) return clearInterval(this.fade);
      const v = Math.min(0.55, this.audioRef.current.volume + 0.04);
      this.audioRef.current.volume = v;
      if (v >= 0.55) clearInterval(this.fade);
    }, 120);
  }

  stopAudio() {
    clearInterval(this.fade);
    const a = this.audioRef.current;
    if (a) { a.pause(); a.volume = 0; }
  }

  toggleMute = () => {
    const muted = !this.state.muted;
    this.setState({ muted });
    if (muted) this.stopAudio();
    else if (this.state.engaged) this.startAudio();
  };

  renderVals() {
    const { muted, active, hoverIndex, engaged } = this.state;
    const sleeves = SLEEVES.map((s, i) => ({
      ...s,
      bx: 1020,
      tx: 1034,
      cx: 1105,
      coverX: 812,
      coverCx: 900,
      coverTx: 826,
      graphicX: 840,
      panelX: 828,
      titleX: 820,
      artT: "translate(828,466) scale(0.8182)",
      isArt1: i === 0,
      isArt2: i === 1,
      isArt3: i === 2,
      isArt4: i === 3,
      isArt5: i === 4,
      discCx: 818,
      by: 632 - (5 - i) * 18,
      ty: 632 - (5 - i) * 18 + 13,
      isHovered: hoverIndex === i || active === i
    }));
    const shown = hoverIndex !== null ? hoverIndex : active;
    if (shown !== null) this.lastIndex = shown;
    return {
      sleeves,
      hoverCover: sleeves[this.lastIndex || 0],
      coverOpacity: shown !== null ? 1 : 0,
      coverTransform: shown !== null ? "translate(0,0)" : "translate(0,18)",
      onDiscEnter: this.onDiscEnter,
      onDiscLeave: this.onDiscLeave,
      onDiscTap: this.onDiscTap,
      card: active === null ? null : SLEEVES[active],
      muteLabel: muted ? "sound off" : "sound on",
      muted,
      recordRef: this.recordRef,
      armRef: this.armRef,
      glowRef: this.glowRef,
      crateRef: this.crateRef,
      hintRef: this.hintRef,
      engaged,
      audioRef: this.audioRef,
      onSleeve: this.onSleeve,
      onSleeveKey: this.onSleeveKey,
      closeCard: this.closeCard,
      onArmDown: this.onArmDown,
      onArmClick: this.onArmClick,
      onArmKey: this.onArmKey,
      toggleMute: this.toggleMute
    };
  }
}

</script>
</body>
</html>
